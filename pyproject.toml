[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specialist-vs-generalist"
version = "0.1.0"
description = "Discharge-safety vignette harness: does a safety-policy layer, not model size, drive discharge safety? Identical local model, identical vignettes, policy layer as the only variable."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch", "transformers"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
